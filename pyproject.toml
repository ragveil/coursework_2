[project]
name = "coursework-2"
version = "0.1.0"
description = ""
authors = [
    {name = "Nadezhda Kornienko",email = "service911@bk.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas (>=2.3.1,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
isort = "^6.0.1"
black = "^25.1.0"
flake8 = "^7.3.0"
mypy = "^1.16.1"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.2.1"
pytest-mock = "^3.14.1"
requests = "^2.32.4"
types-requests = "^2.32.4.20250611"

[tool.isort]
line_length = 119
profile = "black"
multi_line_output = 1

[tool.black]
line-length = 119
exclude = ".git"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true
exclude = 'venv'